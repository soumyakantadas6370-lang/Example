<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
    <style>
        *{
            margin: 0;
            padding: 0;
            border-sizing: border-box;
        }
        body{
            height: auto;
            width: 100vw;
            background-image: url(/image/back.jpg);
            background-repeat: no-repeat;
            background-size: cover;

        #header{
            height: 100px;

        }
        #main{
            height: 250px;
            width: 400px;

        }
        #main p{

        }
        h1{
            color: lightgreen;

        }
        #button{
            height: 50px;
            width: 500px;
           
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        #button button{
            font-size: 20px;
            padding: 2px;
           border-radius: 10px;

        }

</head>

     <div id="button">

</html>
