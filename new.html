<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Hello World</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            
        }
        
        .container{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        .box1{
            height: 500px;
            width: 500px;
            border-radius: 10px;
            background-color: red;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box1:hover{
            background-color: yellow;
            cursor: pointer;
        }
        .box2{
            height: 400px;
            width: 400px;
            border-radius: 10px;
            background-color: blue;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box2:hover{
            background-color: green;
            cursor: pointer;
        }
       .box3{
            height: 300px;
            width: 300px;
            border-radius: 10px;
            background-color: rgb(189, 67, 159);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box3:hover{
            background-color: red;
            cursor: pointer;
        }
        .box4{
            height: 200px;
            width: 200px;
            border-radius:10px;
            background-color: rgb(46, 115, 185);
            display: flex;
            justify-content: center;
            align-items: center;
        
        }
        .box4:hover{
            background-color: blue;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="box1">
        <div class="box2">
            <div class="box3">
                <div class="box4"></div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
