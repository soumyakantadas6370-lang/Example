<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
    <style>
        *{
            margin: 0;
            padding: 0;
            border-sizing: border-box;
        }
        #main{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            background-color: aqua;
        }
        #box{
            height: 400px;
            width: 400px;
            border: 2px solid black;
            background-color: red;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 2s;
        }
        #box:hover{
            background-color: yellow;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            transform: rotate(60deg);
            border-radius: 40px;
        }
    </style>
</head>
<body>
<div id="main">
    <div id="box">
    <h1>Hello World</h1>
    </div>
</div>
</body>
</html>
